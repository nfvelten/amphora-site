replicaCount: 1

image:
  repository: ghcr.io/nfvelten/site
  tag: latest
  pullPolicy: Always
  pullSecrets:
    - name: ghcr-pull-secret

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: site.nicholas-velten.xyz
  clusterIssuer: letsencrypt-production
  tlsSecretName: nicholas-site-tls

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
